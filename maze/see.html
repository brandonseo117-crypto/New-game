<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neural Strand</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <a href="../index.html" class="home-link">← Back to Hub</a>
      <h1 class="game-title">Neural Strand</h1>
    </header>

    <div class="score-container">
      <span id="score-display" class="score-badge">Score: 0</span>
      <div id="toast-container" class="toast-container"></div>
    </div>

    <div class="strands-wrapper">
      <div class="reference-bar">
        <div class="ref-card preferred">
          <span class="ref-label green">Start here</span>
          <div class="img-frame start-frame">
            <img id="pref-img" src="../imagesforgames/neuron34/img01.jpg" alt="Preferred Target" />
          </div>
        </div>

        <div class="ref-instructions">
          <h3>Neural Pathway</h3>
          <p>Draw a line connecting all the images that correspond to the same neuron.</p>
        </div>
      </div>

      <div class="grid-container" id="grid-container">
        <svg class="path-overlay" id="path-overlay">
          <defs>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="4" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>
        </svg>
        <div class="strands-grid" id="strands-grid"></div>
      </div>

      <div id="controls-container">
      <div id="feedback">Draw your strand and tap Check!</div>
      <button id="check-strand-btn" class="check-btn">Check Line</button>
    </div>

      <div id="feedback" class="feedback-msg"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
