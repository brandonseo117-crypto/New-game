<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual Connections - Game Suite</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <header class="app-header">
      <a href="../index.html" class="home-link">← Back to Hub</a>
      <h1 style="color:rgb(1, 0, 76);" class="game-title">Visual Connections</h1>
    </header>

    <main class="connections-container">
      <div id="toast-msg" class="toast-msg hidden"></div>

      <div id="grid-container" class="images-container">
        <svg id="path-overlay"></svg>

        <div class="images" id="strands-grid">
          <img src="imagesforconnections/images_190923_neuron2/image0001.jpg" id="1" data-index="0" draggable="false" />
          <img src="imagesforconnections/images_190923_neuron1/image0003.jpg" id="2" data-index="1" draggable="false" />
          <img src="imagesforconnections/images_190923_neuron1/image0004.jpg" id="3" data-index="2" draggable="false" />
          <img src="imagesforconnections/images_190923_neuron1/image0001.jpg" id="4" data-index="3" draggable="false" />
          <img src="imagesforconnections/images_190923_neuron2/image0002.jpg" id="5" data-index="4" draggable="false" />
          <img src="imagesforconnections/images_190923_neuron0/image0001.jpg" id="6" data-index="5" draggable="false" />
          <img src="imagesforconnections/images_190923_neuron5/image0001.jpg" id="7" data-index="6" draggable="false" />
          <img src="imagesforconnections/images_190923_neuron1/image0002.jpg" id="8" data-index="7" draggable="false" />
          <img src="imagesforconnections/images_190923_neuron2/image0003.jpg" id="9" data-index="8" draggable="false" />
          <img src="imagesforconnections/images_190923_neuron0/image0002.jpg" id="10" data-index="9" draggable="false" />
          <img src="imagesforconnections/images_190923_neuron5/image0002.jpg" id="11" data-index="10" draggable="false" />
          <img src="imagesforconnections/images_190923_neuron5/image0003.jpg" id="12" data-index="11" draggable="false" />
          <img src="imagesforconnections/images_190923_neuron2/image0004.jpg" id="13" data-index="12" draggable="false" />
          <img src="imagesforconnections/images_190923_neuron0/image0003.jpg" id="14" data-index="13" draggable="false" />
          <img src="imagesforconnections/images_190923_neuron0/image0004.jpg" id="15" data-index="14" draggable="false" />
          <img src="imagesforconnections/images_190923_neuron5/image0004.jpg" id="16" data-index="15" draggable="false" />
        </div>
      </div>

      <div class="lives-wrapper">
        <span class="lives-label">Mistakes Remaining:</span>
        <div class="lives">
          <img id="life1" src="https://onedaycolor.com/cdn/shop/products/GPCX1400_12c270b9-82c9-4337-88f4-80aca4793124.png" />
          <img id="life2" src="https://onedaycolor.com/cdn/shop/products/GPCX1400_12c270b9-82c9-4337-88f4-80aca4793124.png" />
          <img id="life3" src="https://onedaycolor.com/cdn/shop/products/GPCX1400_12c270b9-82c9-4337-88f4-80aca4793124.png" />
          <img id="life4" src="https://onedaycolor.com/cdn/shop/products/GPCX1400_12c270b9-82c9-4337-88f4-80aca4793124.png" />
        </div>
      </div>

      <div class="controls-bar">
        <button id="shufflebtn">Shuffle</button>
        <button id="forfeitbtn">Forfeit</button>
        <button id="submitbtn" class="primary-btn">Submit</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
